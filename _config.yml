title: Fernando Cucci
tagline: SAP and AI in enterprise systems
description: >-
  Enterprise Solutions Architect. 15 years in SAP, now working where SAP
  meets AI. Notes on what holds up in enterprise systems, and what doesn't.
author: Fernando Cucci

url: "https://fernandocucci.github.io"
baseurl: ""

linkedin_url: https://www.linkedin.com/in/fernandocucci/
github_url: https://github.com/fernandocucci

# GoatCounter analytics. Only loads on production builds (GitHub Pages sets
# JEKYLL_ENV=production); local `jekyll serve` runs never count.
goatcounter_code: fernandoc

# Default social card; posts override with their own `image:`
# (jekyll-seo-tag reads page-level `image` only — a site-level key is ignored)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og/site.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# GitHub Pages applies these itself and ignores whatever is set here. They are
# spelled out so the local Jekyll (see Gemfile) renders markdown the same way
# instead of falling back to its own defaults.
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Setting `exclude` replaces Jekyll's default list rather than adding to it,
# so the vendor paths have to be named again or the local bundle gets scanned
# as site content.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .bundle/
  - vendor/
