<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  {%- feed_meta -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="masthead">
    <a class="masthead__name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="masthead__nav" aria-label="Elsewhere">
      {%- if site.linkedin_url -%}
      <a href="{{ site.linkedin_url }}" rel="me">LinkedIn</a>
      {%- endif -%}
      {%- if site.github_url -%}
      <a href="{{ site.github_url }}" rel="me">GitHub</a>
      {%- endif -%}
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="colophon">
    <div class="colophon__inner">
      <p>Articles here first appeared elsewhere. Each one links to its original.</p>
      <p class="colophon__meta">© {{ 'now' | date: "%Y" }} {{ site.author }}</p>
    </div>
  </footer>

</body>
</html>
